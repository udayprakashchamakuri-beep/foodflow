services:
  - type: web
    name: foodflow-connect
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: false
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: PORT
        value: 3000
    disk:
      name: foodflow-data
      mountPath: /app/data
      sizeGB: 1
