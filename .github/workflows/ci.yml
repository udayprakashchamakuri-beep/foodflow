name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # node:sqlite (used by server.js) needs a recent Node 22.x build;
        # test against the two most relevant LTS-track versions.
        node-version: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite (unit + integration + smoke test)
        run: npm test

      - name: Boot the server as a final sanity check
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server healthy."
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not become healthy in time."
          kill $SERVER_PID 2>/dev/null || true
          exit 1
